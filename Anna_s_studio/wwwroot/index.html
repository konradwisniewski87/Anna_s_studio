<head>
    <meta charset="utf-8" />

    <base href="%BASE%" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/Contact.css" />
    <link rel="stylesheet" href="css/Gallery.css" />
    <link rel="stylesheet" href="css/Index.css" />

    <link rel="icon" type="image/png" href="images/Logo.png" />
    <link href="Anna_s_studio.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="45%" cx="50%" cy="50%" />
            <circle r="45%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        function initCarouselDescription(dotNetHelper) {
            const carousel = document.getElementById('carouselExampleIndicators');
            if (!carousel) return;

            carousel.addEventListener('slid.bs.carousel', function (event) {
                const index = event.to;
                if (typeof index === 'number') {
                    dotNetHelper.invokeMethodAsync('OnCarouselSlideChanged', index);
                }
            });

            setTimeout(() => {
                const carouselInstance = bootstrap.Carousel.getOrCreateInstance(carousel);
                carouselInstance.to(0);
            }, 100);
        }
    </script>
</body>
</html>
